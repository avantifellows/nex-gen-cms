{{ define "test_setup_modal" }}
<script src="/web/static/js/curriculum-grade-rows.js"></script>
<!-- Lets the user correct the classification (curriculum-grade, exam, test type) chosen while
     creating a test. Only rendered on the edit screen, with the same TestData as add_test.html. -->
<div id="test-setup-modal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-ink/40 p-4"
    onclick="if (event.target === this) closeTestSetupModal()">
    <div class="card shadow-xl rounded-xl w-full max-w-md p-6 max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between border-b border-border pb-3 mb-3">
            <h2 class="page-title">Test Setup</h2>
            <button type="button" class="action-button p-2" aria-label="Close"
                onclick="closeTestSetupModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="test-setup-body" class="flex-1 overflow-y-auto">
            <div class="grid grid-cols-[1fr_1fr_auto] gap-3 items-center">
                <label class="form-label mb-0">Curriculum</label>
                <label class="form-label mb-0">Grade</label>
                <div class="w-6"></div>
            </div>
            <div id="test-setup-curriculum-grade-set" class="grid gap-3 mt-1 mb-4">
                {{/* Count is fixed at 1 so the remove buttons stay hidden until rows can be edited. */}}
                {{ range .TestPtr.CurriculumGrades }}
                    {{ template "curriculum_grade_selects" dict "Item" . "Count" 1 }}
                {{ end }}
            </div>

            <div class="mb-4">
                <label for="test-setup-test-type" class="form-label">Test Type</label>
                <select id="test-setup-test-type" class="form-select">
                    {{ template "test_type_options" .TestPtr }}
                </select>
            </div>

            <div class="mb-2">
                <label for="test-setup-exam-type" class="form-label">Exam Type</label>
                <select id="test-setup-exam-type" class="form-select"
                    data-selected="{{ index .TestPtr.ExamIDs 0 }}"
                    hx-get="/api/exams" hx-trigger="revealed once"
                    hx-on::after-request="selectPreloadedOption(this)">
                    <option disabled selected>Loading exams...</option>
                </select>
            </div>
        </div>

        <div class="mt-4 flex justify-end gap-3 pt-2 border-t border-border">
            <button type="button" class="btn-secondary" onclick="closeTestSetupModal()">
                Cancel
            </button>
        </div>
    </div>
</div>
<script>
    (function () {
        const modal = document.getElementById("test-setup-modal");
        const testTypeSelect = document.getElementById("test-setup-test-type");
        // Captured once at render time: the test's saved values, which closing the modal restores.
        const savedTestType = testTypeSelect.value;

        function restoreSavedValues() {
            modal.querySelectorAll("#test-setup-curriculum-grade-set select, #test-setup-exam-type")
                .forEach(selectPreloadedOption);
            testTypeSelect.value = savedTestType;
        }

        window.openTestSetupModal = function () {
            modal.classList.remove("hidden");
        };

        // Nothing is saved yet, so closing discards whatever was picked.
        window.closeTestSetupModal = function () {
            modal.classList.add("hidden");
            restoreSavedValues();
        };
    })();
</script>
{{ end }}
