{{ define "content" }}
<div>
    <div class="flex flex-wrap justify-between items-center gap-y-3 mb-4">

        <!-- Left side: Test type dropdown + Search -->
        <div class="flex flex-wrap items-center gap-3">

            <!-- hx-trigger="onLoaded from:(#curriculum-dropdown, #grade-dropdown)" is added to load tests on
            coming back from single test to tests list screen -->
            <select id="testtype-dropdown" name="testtype-dropdown" hx-ext="tests-view-loader"
                class="form-select-compact w-auto" hx-get="/tests?mode=filter"
                hx-trigger="change, change from:(#curriculum-dropdown, #grade-dropdown), onLoaded from:(#curriculum-dropdown, #grade-dropdown)"
                hx-target="#test-table-wrapper" hx-include="#curriculum-dropdown, #grade-dropdown, #testtype-dropdown"
                onchange="sessionStorage.setItem('selectedTesttype', this.value); sessionStorage.setItem(window.TESTS_VIEW_LOADED_KEY, 'false'); toggleTestsSubjectDropdown(this.value);">
                {{ template "test_type_options" }}
            </select>

            <!-- Subject filter: only meaningful for Chapter Test, hidden otherwise. Filters rows
            client-side (see filterTestRowsBySubject below) rather than the server - it's never
            included in any /tests or /api/tests request. -->
            <select id="tests-subject-dropdown" name="subject-dropdown" class="form-select-compact w-auto hidden"
                hx-get="/api/subjects" hx-trigger="revealed" hx-swap="beforeend"
                hx-on::after-request="afterSubjectDropdownReq(this)"
                onchange="sessionStorage.setItem('selectedTestSubject', this.value); filterTestRowsBySubject(this.value);">
                <option value="">All Subjects</option>
            </select>

            <!-- Search field -->
            <input type="text" id="test-search" name="search" placeholder="Search tests by code or name..."
                class="form-input w-72" hx-get="/tests?mode=search" hx-ext="search-store"
                hx-trigger="keyup[this.value.length>=3] delay:500ms" hx-target="#test-table-wrapper">

        </div>

        <!-- Add New Test Link -->
        <h4 class="add-new-link ml-4">
            <a href="#"
                hx-get="/tests/add-test-dialog"
                hx-target="body"
                hx-push-url="true"
                hx-swap="beforeend">+ Add New Test</a>
        </h4>
    </div>

    <!-- Content Area -->
    <div id="subcontent">
        <div id="test-table-wrapper" class="card overflow-x-auto my-6">
            <!-- Table content will be loaded here based on mode filter or search -->
        </div>
    </div>

</div>

<div id="download-modal-container"></div>

<script>
    (function () {
        htmx.defineExtension('tests-view-loader', {
            onEvent: function (name, event) {
                if (name === "htmx:afterProcessNode") {
                    restoreState();

                } else if (name === "htmx:beforeRequest") {
                    const requestPath = event.detail.elt.getAttribute("hx-get");

                    if (requestPath === "/tests?mode=filter") {
                        if (sessionStorage.getItem(window.TESTS_VIEW_LOADED_KEY) === "true") {
                            console.log("Skipping /tests request because tests view is already loaded.");
                            event.preventDefault();
                            return;
                        }

                        const params = event.detail.requestConfig.parameters;
                        if (params["testtype-dropdown"] === "") {
                            console.log("Skipping /tests request because test type is not yet selected.");
                            event.preventDefault();

                        } else {
                            const curriculum = params["curriculum-dropdown"];
                            const grade = params["grade-dropdown"];

                            // if dropdown values are showing default value like "Loading...", then don't execute request
                            if (!isInt(curriculum) || !isInt(grade)) {
                                console.log("Skipping /tests request because dropdowns are not loaded yet.");
                                event.preventDefault();

                            } else {
                                const storedCurriculum = sessionStorage.getItem("selectedCurriculum");
                                const storedGrade = sessionStorage.getItem("selectedGrade");

                                if ((storedCurriculum && storedCurriculum !== curriculum) ||
                                    (storedGrade && storedGrade !== grade)) {
                                    // at least 1 dropdown value is 1 (1st item value) and its correct value is yet to be retained from sessionStorage
                                    console.log("Skipping /tests request because dropdowns values are not yet retained.");
                                    event.preventDefault();

                                } else {
                                    // all dropdown values are correctly retained, proceed with request

                                    // Clear stored search text and visible input value
                                    sessionStorage.removeItem('testSearchValue');
                                    const searchInput = document.getElementById('test-search');
                                    if (searchInput) {
                                        searchInput.value = '';
                                    }
                                }
                            }
                        }
                    }
                
                } else if (name === "htmx:afterRequest") {
                    const requestPath = event.detail.elt.getAttribute("hx-get");

                    if (requestPath === "/tests?mode=filter") {
                        const status = event.detail.xhr.status;
                        if (status >= 200 && status < 300) {
                            // reset TESTS_LOADED_KEY here so that tests_filter_view can load tests
                            sessionStorage.setItem(window.TESTS_LOADED_KEY, 'false');
                            
                            sessionStorage.setItem(window.TESTS_VIEW_LOADED_KEY, 'true');
                        }
                    }
                }
            }
        });

        function restoreState() {
            // Restore search field
            const searchInput = document.getElementById('test-search');
            if (!searchInput) return;

            const storedSearch = sessionStorage.getItem('testSearchValue') || '';
            searchInput.value = storedSearch;
            let searchRestored = false;

            // If search was active previously, trigger the HTMX search again
            if (storedSearch.length >= 3) {
                // Explicit HTMX request
                htmx.ajax('GET', '/tests?mode=search', {
                    target: '#test-table-wrapper',
                    values: { search: storedSearch }
                });
                searchRestored = true;
            }

            const dropdown = document.getElementById('testtype-dropdown');
            if (!dropdown) return;

            const storedTesttype = sessionStorage.getItem('selectedTesttype');

            if (storedTesttype && dropdown.value !== storedTesttype) {
                dropdown.value = storedTesttype;
                toggleTestsSubjectDropdown(storedTesttype);

                // htmx's history cache restores DOM structure (so #tests-subject-dropdown may
                // already have its real <option>s from before) but not <select> selectedness,
                // since picking an option only mutates the live .value, never the underlying
                // HTML. Apply the stored subject directly when its option is already present; if
                // not (fresh server render, only the default option exists yet),
                // afterSubjectDropdownReq() applies it once /api/subjects loads for real.
                const subjectDropdown = document.getElementById('tests-subject-dropdown');
                const storedTestSubject = sessionStorage.getItem('selectedTestSubject');
                if (subjectDropdown && storedTestSubject &&
                    subjectDropdown.querySelector(`option[value="${storedTestSubject}"]`)) {
                    subjectDropdown.value = storedTestSubject;
                }
                filterTestRowsBySubject(subjectDropdown ? subjectDropdown.value : '');

                // Trigger native change event so HTMX picks it up
                if (!searchRestored) {
                    htmx.trigger(dropdown, 'change');
                }
            }
        }

        // Shows the subject filter only for Chapter Test, since subject filtering is only
        // meaningful for that test type. Exposed on window since it's called from inline
        // onchange/restoreState, both of which resolve names against the global scope, not this
        // IIFE's closure.
        window.toggleTestsSubjectDropdown = function (testtype) {
            const subjectDropdown = document.getElementById('tests-subject-dropdown');
            if (!subjectDropdown) return;
            subjectDropdown.classList.toggle('hidden', testtype !== 'chapter_test');
        };

        // Shows/hides #test-table-body rows by their data-subject-id (set from
        // Test.ChapterTestSubjectID in test_row.html) - the subject filter never triggers a
        // server request, so this is the only place selecting a subject takes effect. Called on
        // subject change, on restore, and after every /api/tests row swap (tests_filter_view.html's
        // tests-loader extension, for initial load and sort clicks). Exposed on window for the
        // same cross-scope reason as toggleTestsSubjectDropdown above.
        window.filterTestRowsBySubject = function (subjectId) {
            const tbody = document.getElementById('test-table-body');
            if (!tbody) return;
            tbody.querySelectorAll(':scope > tr').forEach(function (row) {
                const matches = !subjectId || row.dataset.subjectId === subjectId;
                row.classList.toggle('hidden', !matches);
            });
        };

        // hx-on::after-request handler for #tests-subject-dropdown: restores the last-selected
        // subject once its real options have loaded (same idea as home.html's afterDropdownReq
        // for curriculum/grade/subject), then re-applies the row filter in case rows already
        // loaded first. Exposed on window since hx-on:: attributes resolve names against the
        // global scope.
        window.afterSubjectDropdownReq = function (dropdown) {
            const storedSubject = sessionStorage.getItem('selectedTestSubject');
            if (storedSubject) {
                dropdown.value = storedSubject;
            }
            filterTestRowsBySubject(dropdown.value);
        };

        htmx.defineExtension('search-store', {
            onEvent: function (name, evt) {
                if (name === 'htmx:beforeRequest') {
                    const input = document.getElementById('test-search');
                    const search = input.value.trim();
                    if (search.length >= 3) {
                        sessionStorage.setItem('testSearchValue', search);
                    }
                }
            }
        });
    })();
</script>
{{ end }}
