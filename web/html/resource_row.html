{{ range . }}
<tr class="border-b border-border/40 hover:bg-bg-hover transition-colors{{ if not .Active }} opacity-50{{ end }}">
    <td class="py-4 px-6">{{.Code}}</td>
    <td class="px-6">{{ getName . "en" }}</td>
    <td class="px-6">{{.Type}}</td>
    <td class="px-6">{{.Subtype}}</td>
    <td class="px-6 text-accent hover:text-accent-hover hover:underline font-medium">
        {{ if .TypeParams.SrcLink }}
        <a href="{{ .TypeParams.SrcLink }}" target="_blank" rel="noopener noreferrer">
            {{ .TypeParams.SrcLink }}
        </a>
        {{ end }}
    </td>
    <td class="px-6 text-center">
        <button class="action-button" hx-post="/toggle-resource-active" hx-vals='{"id":"{{.ID}}","active":"{{ if .Active }}false{{ else }}true{{ end }}"}'
            hx-target="closest tr" hx-swap="outerHTML"
            {{ if .Active }}
            hx-confirm="Retire {{ getName . "en" }}? Students stop seeing it; the row stays so existing reports still resolve."
            title="Active - click to retire"
            {{ else }}
            title="Retired - click to bring back"
            {{ end }}>
            {{ if .Active }}
            <i class="fa-solid fa-circle-check text-green-600"></i>
            {{ else }}
            <i class="fa-regular fa-circle text-ink-muted"></i>
            {{ end }}
        </button>
    </td>
    <td class="space-x-4">
        <button class="action-button" hx-get="/edit-resource?id={{.ID}}" hx-target="#subContent" hx-push-url="true">
            <i class="fa-solid fa-pen"></i>
        </button>
        <button class="action-button" hx-post="/resources/move-resource" hx-target="body" hx-swap="beforeend"
            hx-vals='{"resource_ids":"{{.ID}}"}' title="Move Resource">
            <i class="fa-solid fa-right-left"></i>
        </button>
        <button class="action-button" hx-delete="/delete-resource?id={{.ID}}"
            hx-confirm="Are you sure you want to delete resource {{ getName . "en" }}?" hx-target="closest tr">
            <i class="fa-solid fa-trash"></i>
        </button>
    </td>
</tr>
{{ end }}
