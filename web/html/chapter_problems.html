<div>
    <div class="flex flex-wrap items-center gap-3 mb-4">
        <!-- Optional single-topic filter: lists only this chapter's topics; the blank "All Topics" option shows
             every problem of the chapter. Its value is included in the table's requests below. -->
        <select id="problems-topic-filter" name="topic-dropdown" class="form-select w-auto"
            hx-get="/api/topics?view=dropdown-all&id={{.}}" hx-include="#curriculum-dropdown"
            hx-trigger="load[document.getElementById('problems-topic-filter').options.length < 2]"
            hx-target="this" hx-swap="innerHTML">
            <option value="" selected>All Topics</option>
        </select>

        <button class="btn-primary btn-sm" hx-target="body"
            hx-get="/chapter/add-problem?chapter_id={{.}}" hx-push-url="true">+ Add New Problem
        </button>

        <button id="move-problems-btn" hx-include='input[name="select-problem"]:checked'
            class="btn-primary btn-sm group min-w-[140px] disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-bg-card-alt disabled:text-ink-muted"
            hx-post="/problems/test-associations" hx-target="body"
            hx-swap="beforeend" disabled>

            <span class="group-[.htmx-request]:hidden">Move Problems</span>

            <span class="hidden group-[.htmx-request]:inline-flex">
                <div class="w-4 h-4 border-2 border-text-on-accent border-t-transparent rounded-full animate-spin"></div>
            </span>

        </button>

    </div>

    <div class="card overflow-hidden">
        <table class="app-table">
            <colgroup>
                <col class="w-8">   <!-- Checkbox -->
                <col class="w-24">   <!-- Code -->
                <col>                    <!-- Text (flexes) -->
                <col class="w-24">   <!-- Actions -->
            </colgroup>
            <thead>
                <tr>
                    <th class="text-center">
                        <input type="checkbox" id="select-all" class="accent-accent">
                    </th>
                    <th>Code</th>
                    <th>Text</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <!-- In before-request, condition is added to only clear the tbody
             when the request comes from the tbody itself (its own refresh on load);
             otherwise it reloads even on just clicking copy problem button for any row -->
            <!-- Lazy loading: the infinite-scroll extension loads the next 10 rows when the sentinel below the
                 table scrolls into view, and shows / hides the loader (data-loader) for every page. -->
            <tbody id="problemTableBody" class="text-ink-muted text-sm"
                hx-ext="infinite-scroll" data-limit="10" data-offset="0" hx-sync="this:replace"
                data-loader="#chapter-problems-loader" data-sentinel="#chapter-problems-sentinel"
                hx-trigger="refreshProblems, change from:#problems-topic-filter"
                hx-get="/api/chapter/problems?chapter-dropdown={{.}}&limit=10&offset=0" hx-include="#curriculum-dropdown, #subject-dropdown, #problems-topic-filter"
                hx-on::before-request="if (event.detail.elt === this) this.innerHTML=''"
                hx-on::after-swap="updateHeaderState()" data-mathjax="true">
                <!-- Rows will be dynamically inserted here -->
            </tbody>
        </table>
    </div>
    <div id="chapter-problems-sentinel"></div>
    <div id="chapter-problems-loader" class="hidden justify-center py-4">
        <div class="w-6 h-6 mx-auto border-4 border-border border-t-accent rounded-full animate-spin"></div>
    </div>
</div>
<script>
    var selectAll = document.getElementById("select-all");
    var tbody = document.getElementById("problemTableBody");
    var moveBtn = document.getElementById("move-problems-btn");

    var chapterId = '{{.}}';

    // Initial load via script, because load hx-trigger on tbody is not working when this screen is 
    // opened from javascript after copy-save navigation 
    function loadChapterProblems() {
        const curriculum = document.getElementById('curriculum-dropdown').value;
        const subject = document.getElementById('subject-dropdown').value;
        if (!curriculum || !subject) return false;
        // The curriculum, subject and topic filter values are not added to this URL: because the tbody is the
        // request source, htmx adds them itself from the tbody's hx-include (adding them here sent them twice).
        htmx.ajax('GET', `/api/chapter/problems?chapter-dropdown=${chapterId}&limit=10&offset=0`, {
            source: '#problemTableBody',
            target: '#problemTableBody',
            swap: 'innerHTML',
        });
        return true;
    }

    function filtersLoading() {
        const curriculumEl = document.getElementById('curriculum-dropdown');
        const subjectEl = document.getElementById('subject-dropdown');
        return !curriculumEl.options[0] || curriculumEl.options[0].disabled
            || !subjectEl.options[0] || subjectEl.options[0].disabled;
    }

    function initChapterProblemsList() {
        const curriculumEl = document.getElementById('curriculum-dropdown');
        const subjectEl = document.getElementById('subject-dropdown');

        function tryLoad() {
            if (loadChapterProblems()) cleanup();
        }

        function cleanup() {
            curriculumEl.removeEventListener('onLoaded', tryLoad);
            subjectEl.removeEventListener('onLoaded', tryLoad);
        }

        if (filtersLoading()) {
            curriculumEl.addEventListener('onLoaded', tryLoad);
            subjectEl.addEventListener('onLoaded', tryLoad);
        } else {
            tryLoad();
        }
    }

    var getCheckboxes = () =>
        tbody.querySelectorAll('input[name="select-problem"]');

    // The history snapshot keeps a checkbox's state only as an attribute, so mirror every change there.
    var syncCheckedAttributes = () =>
        [selectAll, ...getCheckboxes()].forEach(cb => cb.toggleAttribute('checked', cb.checked));

    var updateHeaderState = () => {
        const all = getCheckboxes();
        const checked = tbody.querySelectorAll('input[name="select-problem"]:checked');

        selectAll.checked = all.length > 0 && all.length === checked.length;
        selectAll.indeterminate = checked.length > 0 && checked.length < all.length;

        // Enable / disable Move Problems button
        moveBtn.disabled = checked.length === 0;
        syncCheckedAttributes();
    };

    // Select All
    selectAll.addEventListener("change", function () {
        const checked = this.checked;
        getCheckboxes().forEach(cb => {
            cb.checked = checked;
        });
        selectAll.indeterminate = false;
        moveBtn.disabled = !checked;
        syncCheckedAttributes();
    });

    // Individual checkbox
    tbody.addEventListener("change", function (e) {
        if (e.target.name !== "select-problem") return;
        updateHeaderState();
    });

    // Back navigation rebuilds this page from saved HTML with its rows already loaded: only re-attach what
    // the HTML cannot keep, and reload just when a problem was added, edited or deleted meanwhile.
    function restoreChapterProblems() {
        // the saved HTML does not keep the selected topic, but the last request's params do
        const activeParams = new URLSearchParams(tbody.getAttribute('data-active-params') || '');
        document.getElementById('problems-topic-filter').value = activeParams.get('topic-dropdown') || '';

        if (sessionStorage.getItem(REFRESH_CHAPTER_PROBLEMS_ON_BACK_KEY)) {
            sessionStorage.removeItem(REFRESH_CHAPTER_PROBLEMS_ON_BACK_KEY);
            // deferred, because while htmx swaps the page in, the page's dropdowns exist twice
            setTimeout(initChapterProblemsList, 0);
        } else {
            htmx.trigger(tbody, 'infinite-scroll:restore');
            updateHeaderState();
        }
    }

    if (tbody.children.length === 0) {
        // a fresh load is up to date already
        sessionStorage.removeItem(REFRESH_CHAPTER_PROBLEMS_ON_BACK_KEY);
        initChapterProblemsList();
    } else {
        restoreChapterProblems();
    }
</script>
