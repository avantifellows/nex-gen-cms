{{ if not .Selected }}
<option value="" selected disabled hidden>Select Sequence</option>
{{ end }}
{{ range .Sequences }}
<!-- value is set explicitly so the submitted value stays the plain number even with the
     "✓ " prefix below; "%d" converts . to a string so it can be compared with $.Selected -->
<option value="{{.}}" {{if eq $.Selected (printf "%d" .)}}selected{{end}}>{{.}}{{if index $.UsedSequences .}} &#10003;{{end}}</option>
{{ end }}
