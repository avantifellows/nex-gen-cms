{{ $selected := .Selected }}
{{ range .Topics }}
<label class="flex items-center gap-2 px-3 py-1.5 text-sm text-ink hover:bg-bg-hover cursor-pointer">
    <input type="checkbox" name="topic-ids" value="{{.ID}}" class="accent-accent" {{ if index $selected .ID }}checked{{ end }}>
    <span>{{ getName . "en" }}</span>
</label>
{{ end }}
{{ range .Other }}
<label class="flex items-center gap-2 px-3 py-1.5 text-sm text-ink hover:bg-bg-hover cursor-pointer">
    <input type="checkbox" name="topic-ids" value="{{.Topic.ID}}" class="accent-accent" checked>
    <span>{{ getName .Topic "en" }} <span class="text-ink-muted">({{ .Note }})</span></span>
</label>
{{ end }}
{{ if not (or .Topics .Other) }}
<p class="px-3 py-1.5 text-sm text-ink-muted">No topics in this chapter</p>
{{ end }}
